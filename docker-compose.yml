# From repo root: copy .env.example to .env, then:
#   docker compose up --build

services:
  db:
    image: postgres:16-alpine
    env_file:
      - ./.env
    ports:
      - "5430:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./be
    ports:
      - "${API_HOST_PORT:-8600}:8000"
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./be/src:/app/src
    env_file:
      - ./.env
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  fe:
    build: ./fe
    ports:
      - "${FE_HOST_PORT:-5180}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8600}
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./fe:/app
      - fe_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  fe_node_modules:
